server {
  listen 80;
  root /usr/share/nginx/html;

  # API, admin and static files go to Django
  location /api/    { proxy_pass http://backend:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
  location /admin/  { proxy_pass http://backend:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
  location /static/ { proxy_pass http://backend:8000; }

  # Single-page app
  location / { try_files $uri /index.html; }
}
