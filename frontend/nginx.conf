# Keep the scheme the company proxy received ("https"); fall back to our own only when nothing was sent.
# Overwriting it with $scheme ("http" here, behind the proxy) would make Django redirect to HTTPS forever.
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

server {
  listen 80;
  root /usr/share/nginx/html;

  # Dish photos are up to 5 MB (FR-29).
  client_max_body_size 6m;

  # API, admin and static files (served by WhiteNoise) go to Django
  location ~ ^/(api|admin|static)/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Dish photos: the "media" volume the backend writes to, mounted read-only here
  location /media/ {
    alias /srv/media/;
    expires 7d;
  }

  # Files with a hash in their name never change: cache them for a year
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # The page and the service worker must always be fresh, so phones get a new version at once
  location = /index.html { add_header Cache-Control "no-cache"; }
  location = /sw.js { add_header Cache-Control "no-cache"; }

  # Single-page app
  location / { try_files $uri /index.html; }
}
